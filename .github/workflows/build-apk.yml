
name: Build RinBridge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Manifest File
        run: |
          echo "Checking AndroidManifest.xml"
          test -f app/src/main/AndroidManifest.xml

      - name: Display Manifest
        run: |
          echo "===== MANIFEST CONTENT ====="
          cat -A app/src/main/AndroidManifest.xml

      - name: Validate Manifest XML
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          xmllint --noout app/src/main/AndroidManifest.xml

          echo "MANIFEST XML IS VALID"

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RinBridge-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
