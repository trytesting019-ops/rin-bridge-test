
name: Build RinBridge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Manifest File
        run: |
          test -f app/src/main/AndroidManifest.xml

      - name: Validate Manifest XML
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          xmllint --noout app/src/main/AndroidManifest.xml
          echo "MANIFEST XML IS VALID"

      - name: List Kotlin Source Files
        run: |
          echo "===== KOTLIN FILES ====="
          find app/src/main/java -type f -name "*.kt" -print

      - name: Build Kotlin with Detailed Log
        shell: bash
        run: |
          set +e
          gradle :app:compileDebugKotlin --rerun-tasks --info --stacktrace 2>&1 | tee kotlin-error.log
          RESULT=${PIPESTATUS[0]}
          echo "===== KOTLIN ERROR SUMMARY ====="
          grep -n -E "e: |error:|Unresolved reference|Compilation error" kotlin-error.log || true
          exit $RESULT

      - name: Show Kotlin Compiler Errors
        if: always()
        run: |
          echo "===== KOTLIN ERRORS ====="
          grep -n -B 8 -A 12 -E "e: |error:" kotlin-error.log || true
          echo "===== SOURCE FILE LIST ====="
          find app/src/main/java -type f -name "*.kt" -print

      - name: Build APK
        if: success()
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RinBridge-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
